# Cloudflare Worker that serves the site from the R2 bucket "fjalorishqip".
# The deploy workflow (.github/workflows/deploy-cloudflare.yml) uploads ./dist to the bucket and deploys this Worker.
name = "fjalorishqip"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# www.fjalorishqip.org is redirected to the main domain by this Worker. The main domain itself is served straight
# from the bucket behind Cloudflare's cache (scripts/cloudflare-setup.ts), so page views do not count as Worker requests.
routes = [
  { pattern = "www.fjalorishqip.org", custom_domain = true },
  # the contact form (src/worker/contact.ts); its send_email binding is added at deploy from the CONTACT_EMAIL secret
  { pattern = "fjalorishqip.org/kontakt", zone_name = "fjalorishqip.org" },
  # reports and suggestions from the word pages (src/worker/report.ts)
  { pattern = "fjalorishqip.org/raporto", zone_name = "fjalorishqip.org" },
  # daily notifications: subscribe / unsubscribe, and the app open counter (src/worker/push.ts)
  { pattern = "fjalorishqip.org/njoftime", zone_name = "fjalorishqip.org" },
  { pattern = "fjalorishqip.org/hap", zone_name = "fjalorishqip.org" },
]

# every Monday at 07:00 UTC: the week's reports and suggestions are emailed to the author (src/worker/report.ts);
# every minute of 06:00 and 17:00 UTC (08:00 and 19:00 in Albania in summer, an hour earlier in winter):
# the next batch of the daily notifications, word of the day in the morning, a proverb in the evening (src/worker/push.ts)
[triggers]
crons = ["0 7 * * 1", "* 6 * * *", "* 17 * * *"]

[[r2_buckets]]
binding = "SITE"
bucket_name = "fjalorishqip"

# private: reports wait here until the Monday email (created by scripts/cloudflare-setup.ts, never public)
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "fjalorishqip-raporte"

[vars]
# "1" keeps the whole site out of search engines (also set NOINDEX: "1" for the build in deploy-cloudflare.yml).
# Launched publicly on 2026-10-11, so "0".
NOINDEX = "0"
CANONICAL_HOST = "fjalorishqip.org"

[observability]
enabled = true

# The usage guard's offline page: a separate Worker ("fjalorishqip-offline") on a route in front of the bucket,
# deployed at 95% of a free R2 allowance and deleted again when usage is back under it (.github/workflows/usage-guard.yml).
[env.offline]
workers_dev = false
routes = [
  { pattern = "fjalorishqip.org/*", zone_name = "fjalorishqip.org" },
]

[env.offline.triggers]
crons = []

[env.offline.vars]
OFFLINE = "1"
