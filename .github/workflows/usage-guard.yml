# Hourly check that the site stays inside Cloudflare's free R2 allowance (scripts/usage-guard.ts). Every hour it acts at once
# when an allowance reaches 95% (offline page, or the Worker's writes off); warnings, the email of a failed run and the
# normal Worker redeploy happen only in the 06:00 UTC run (or a run started by hand), so there is no hourly email.
#   under 80%  → the Worker is (re)deployed normally, so the site comes back online in the next billing period (from the 10th)
#   80% – 95%  → this run fails, so GitHub sends an email
#   95% of Class A (uploads/writes) → the site stays online (visitors only read); the Worker is deployed with its own
#                 writes turned off (R2_WRITES=off) and deploys are blocked until the next billing period (the 10th); the run fails
#   95% or more of reads or storage → a small offline Worker is put in front of the site (it reads nothing from R2), and the run fails
# Uses the same secrets as deploy-cloudflare.yml; the API token also needs "Account Analytics: Read".
name: Cloudflare usage guard
on:
  schedule:
    - cron: "0 * * * *" # every hour (a sudden flood of requests is caught within the hour)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Check this billing period's usage (from the 10th)
        id: guard
        run: |
          code=0
          npx tsx scripts/usage-guard.ts || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # the daily run: 06:00 UTC, or started by hand
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(date -u +%H)" = 06 ]; then echo "daily=1" >> "$GITHUB_OUTPUT"; else echo "daily=0" >> "$GITHUB_OUTPUT"; fi
      - name: Take the site offline (95% of a free allowance used)
        if: steps.guard.outputs.code == '2'
        run: npx --yes wrangler@4 deploy --env offline
      - name: Keep the site online (remove the offline Worker if it is there)
        if: steps.guard.outputs.code == '4' || (steps.guard.outputs.daily == '1' && (steps.guard.outputs.code == '0' || steps.guard.outputs.code == '1'))
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          curl -s -o /dev/null -w "offline Worker removal: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fjalorishqip-offline?force=true"
          # Class A used up: the Worker answers without writing to R2 until the next billing period (the 10th)
          writes=on; if [ "${{ steps.guard.outputs.code }}" = 4 ]; then writes=off; fi
          # the contact form's binding comes from a secret, as in deploy-cloudflare.yml (without it the form would stop working)
          if [ -n "$CONTACT_EMAIL" ]; then
            printf '\n[[send_email]]\nname = "CONTACT"\ndestination_address = "%s"\n' "$CONTACT_EMAIL" >> wrangler.toml
            npx --yes wrangler@4 deploy --var "CONTACT_TO:$CONTACT_EMAIL" --var "R2_WRITES:$writes"
          else
            npx --yes wrangler@4 deploy --var "R2_WRITES:$writes"
          fi
      - name: Report
        # the daily run reports every problem; the hourly runs only the urgent ones (offline, writes off)
        if: steps.guard.outputs.code != '0' && (steps.guard.outputs.daily == '1' || steps.guard.outputs.code == '2' || steps.guard.outputs.code == '4')
        run: |
          case "${{ steps.guard.outputs.code }}" in
            1) echo "::error::Over 80% of a free R2 allowance this billing period (see the summary)." ;;
            2) echo "::error::Over 95% of the free R2 reads or storage: the site is OFFLINE until the next billing period (the 10th)." ;;
            4) echo "::error::Over 95% of the free R2 uploads (Class A): deploys and the Worker's writes are paused until the next billing period (the 10th); the site stays online." ;;
            *) echo "::error::Could not read the usage from Cloudflare (check the API token permissions)." ;;
          esac
          exit 1
