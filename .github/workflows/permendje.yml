# Every day: where FjaloriShqip is mentioned or used (scripts/permendje.ts). The full list is kept in
# permendje/README.md; the last 7 days' new places go to the private reports bucket, and Monday's email puts them on top
# (src/worker/index.ts). One small file is uploaded a day (about 30 of the free 1,000,000 uploads a billing period). The commit has [skip ci], so nothing is deployed.
name: Permendjet
on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *" # every day, so no post in the Google Alerts feed is missed
permissions:
  contents: write
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  mentions:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Look for mentions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/permendje.ts
      - name: Keep the list
        run: |
          git add permendje/permendje.json permendje/README.md
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Permendjet: the week's mentions [skip ci]"
          git push
      - name: Give Monday's email the week's mentions
        run: npx --yes wrangler@4 r2 object put fjalorishqip-raporte/permendje/java.txt --file permendje/java.txt --content-type "text/plain; charset=utf-8" --remote
