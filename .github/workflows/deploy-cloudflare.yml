# Builds the dictionary from the open sources and publishes it on Cloudflare:
# the files go to the R2 bucket "fjalorishqip" and the Worker in wrangler.toml serves them.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# The API token needs "Workers Scripts: Edit" and "Account Analytics: Read" (for the usage check), plus the zone and R2
# permissions listed at the top of scripts/cloudflare-setup.ts.
# Daily usage protection: usage-guard.yml.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # every Monday: refresh data from the sources
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare secrets
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_KEY R2_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see the comment at the top of this workflow)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Check this billing period's free R2 usage (deploys stop at 95%)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          code=0
          npx tsx scripts/usage-guard.ts || code=$?
          if [ "$code" = 2 ]; then echo "::error::Over 95% of the free R2 reads or storage this billing period: deploy blocked until the next billing period (the 10th)."; exit 1; fi
          if [ "$code" = 4 ]; then
            # uploads used up: no file goes to R2, but the zone rules and the Worker (with its R2 writes off) still
            # update, since neither touches R2; no cache purge (that would make Cloudflare read every page again)
            npx tsx scripts/cloudflare-setup.ts --rules-only
            if [ -n "$CONTACT_EMAIL" ]; then
              printf '\n[[send_email]]\nname = "CONTACT"\ndestination_address = "%s"\n' "$CONTACT_EMAIL" >> wrangler.toml
              npx --yes wrangler@4 deploy --var "CONTACT_TO:$CONTACT_EMAIL" --var "R2_WRITES:off"
            else
              npx --yes wrangler@4 deploy --var "R2_WRITES:off"
            fi
            echo "::error::Over 95% of the free R2 uploads this billing period: rules and Worker updated, no files uploaded until the next billing period (the 10th)."
            exit 1
          fi
          if [ "$code" = 3 ]; then echo "::error::Could not read the usage from Cloudflare (check the API token permissions)."; exit 1; fi
          if [ "$code" = 1 ]; then echo "::warning::Over 80% of a free R2 allowance this billing period."; fi
      - run: npm test
      - run: npm run sources
      - run: npm run data
      - name: Data quality report (warnings only, see scripts/quality-check.ts)
        run: npx tsx scripts/quality-check.ts
      - run: npm run build
        env:
          NOINDEX: "0" # "1" would keep the site out of search engines (set it in wrangler.toml too)
          SITE_URL: ${{ vars.SITE_URL || 'https://fjalorishqip.org' }}
      - name: Upload changed files to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          # Upload budget: count exactly which files would be uploaded (a dry run only lists the bucket, about one
          # call per 1,000 files) and upload nothing if this billing period's uploads would then pass 75% of the free allowance
          # (scripts/usage-guard.ts --budget). A text change in the page layout touches every page (~94,000 files).
          rclone sync dist r2:fjalorishqip --checksum --no-unicode-normalization --fast-list --checkers 64 --dry-run \
            --log-level NOTICE --log-file dryrun.log || { echo "::error::Could not compare with the bucket."; exit 1; }
          planned=$(grep -c "Skipped copy as --dry-run is set" dryrun.log || true)
          echo "Files to upload: $planned"
          code=0
          npx tsx scripts/usage-guard.ts --budget "$planned" || code=$?
          if [ "$code" = 5 ]; then echo "::error::This deploy would upload $planned files and pass 75% of this billing period's free uploads: nothing was uploaded. Deploy again in the next billing period (from the 10th), or make the change smaller."; exit 1; fi
          if [ "$code" != 0 ]; then echo "::error::Could not check this billing period's uploads: nothing was uploaded."; exit 1; fi
          # --checksum: only files whose content changed are uploaded; files no longer built are removed afterwards
          # --no-unicode-normalization: names are compared exactly, so a page stored with decomposed letters (e + ̈) is replaced by the composed one (ë) that browsers ask for
          rclone sync dist r2:fjalorishqip --checksum --no-unicode-normalization --fast-list --transfers 32 --checkers 64 --stats-one-line --stats 30s \
            --log-level INFO --log-file rclone.log
          grep -c "Copied" rclone.log || true
      - name: Serve the main domain from the bucket and empty Cloudflare's cache (scripts/cloudflare-setup.ts)
        run: npx tsx scripts/cloudflare-setup.ts
      - name: Deploy the Worker (www redirect and the contact form)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          # the contact form's destination stays out of the repository: added here from a secret
          if [ -n "$CONTACT_EMAIL" ]; then
            printf '\n[[send_email]]\nname = "CONTACT"\ndestination_address = "%s"\n' "$CONTACT_EMAIL" >> wrangler.toml
            npx --yes wrangler@4 deploy --var "CONTACT_TO:$CONTACT_EMAIL"
          else
            echo "::warning::No CONTACT_EMAIL secret: the contact form will answer that it is unavailable."
            npx --yes wrangler@4 deploy
          fi
      - name: Tell search engines which pages changed (IndexNow)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://fjalorishqip.org' }}
        run: npx tsx scripts/indexnow.ts rclone.log
